[package]
name = "fin"
version = "0.1.0"
edition = "2024"
description = "Report the work you finished, from GitHub, Jira and other sources"
repository = "https://github.com/joakimen/fin"
license = "MIT"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
indicatif = "0.18.6"
jiff = { version = "0.2.37", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
terminal_size = "0.4.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.6"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.48.0"

[profile.release]
strip = true
